{% raw %}<!DOCTYPE html>{% endraw %}
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ doc_name or "Office" }} — Thanatos</title>
  <style>
    html,body{margin:0;height:100%;background:#0d1b3e;font-family:system-ui,Segoe UI,Roboto,sans-serif}
    #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
    #bar{height:38px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 14px;color:#c8a96e;background:#0a142e;font-size:13px}
    #bar b{color:#fff;font-weight:600}
    #frameholder{flex:1 1 auto;position:relative}
    #office_frame{position:absolute;inset:0;width:100%;height:100%;border:0}
    .err{color:#fff;padding:40px;max-width:640px;margin:0 auto;line-height:1.5}
    .err h1{color:#c8a96e}
    a.back{color:#c8a96e;text-decoration:none}
  </style>
</head>
<body>
{% if error %}
  <div class="err">
    <h1>Impossibile aprire il documento</h1>
    <p>{{ error }}</p>
    <p><a class="back" href="javascript:history.back()">&larr; Torna indietro</a></p>
  </div>
{% else %}
  <div id="wrap">
    <div id="bar"><b>{{ doc_name }}</b><span>{{ "modificabile" if can_write else "sola lettura" }}</span></div>
    <div id="frameholder">
      <form id="office_form" target="office_frame" action="{{ src }}" method="post">
        <input type="hidden" name="access_token" value="{{ access_token }}"/>
      </form>
      <iframe id="office_frame" name="office_frame" allow="clipboard-read; clipboard-write"
              allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"></iframe>
    </div>
  </div>
  <script>document.getElementById("office_form").submit();</script>
{% endif %}
</body>
</html>
