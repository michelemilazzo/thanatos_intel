{% extends "templates/web.html" %}
{% block page_content %}
<div style="max-width:820px;margin:0 auto;padding:24px 16px">
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
    <h1 style="margin:0">Documenti legali</h1>
    <a href="/portal" style="font-size:13px">← Portale</a>
  </div>
  <div style="background:#f3f6ff;border:1px solid #dfe7ff;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px;color:#334">
    {{ disclaimer }}
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    {% for d in docs %}
    <a href="#{{ d.key }}" style="font-size:13px;padding:5px 10px;border:1px solid #ddd;border-radius:16px;text-decoration:none">{{ d.titolo }}</a>
    {% endfor %}
  </div>

  {% for d in docs %}
  <section id="{{ d.key }}" style="border:1px solid #eee;border-radius:10px;padding:18px 20px;margin-bottom:18px;background:#fff">
    <div class="legal-body">{{ frappe.utils.md_to_html(d.testo) }}</div>
  </section>
  {% endfor %}

  <p style="font-size:12px;color:#888">Versione {{ version }}. Per assistenza: <a href="/portal">area clienti</a>.</p>
</div>
<style>
.legal-body h2{font-size:20px;margin:0 0 10px}
.legal-body h3{font-size:16px;margin:14px 0 6px}
.legal-body p{line-height:1.55;font-size:14px;color:#222}
.legal-body ul{padding-left:20px;font-size:14px;line-height:1.5}
.legal-body strong{color:#0D1B3E}
</style>
{% endblock %}
