server {
    listen 80;
    server_name docuseal.thanatos.agency;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name docuseal.thanatos.agency;

    ssl_certificate     /etc/ssl/cloudflare/thanatos-agency.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thanatos-agency.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50M;

    # Static brand assets served directly from disk
    location = /thanatos-brand.css {
        root /etc/nginx/static;
        add_header Cache-Control "public, max-age=600";
        add_header Content-Type "text/css";
    }
    location = /thanatos-brand.js {
        root /etc/nginx/static;
        add_header Cache-Control "public, max-age=600";
        add_header Content-Type "application/javascript";
    }
    location = /favicon.ico {
        proxy_pass https://www.thanatos.agency/assets/thanatos_intel/images/thanatos-icon-32.png;
        proxy_ssl_server_name on;
    }
    location = /thanatos-logo.png {
        proxy_pass https://www.thanatos.agency/assets/thanatos_intel/images/thanatos-logo-mark.png;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;

        # Required for sub_filter to work (disables upstream gzip)
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;

        # Inject brand CSS + JS before </head>
        sub_filter "</head>" "<link rel=\"icon\" href=\"/favicon.ico\"><link rel=\"stylesheet\" href=\"/thanatos-brand.css\"><script defer src=\"/thanatos-brand.js\"></script></head>";

        # Title replacements
        sub_filter "| DocuSeal</title>"    "| Thanatos Sign</title>";
        sub_filter "<title>DocuSeal"       "<title>Thanatos Sign";
        sub_filter "DocuSeal | Open Source Document Signing" "Thanatos Intel — Firma elettronica";
        sub_filter ">DocuSeal<"            ">Thanatos Sign<";

        # Text replacements
        sub_filter "- open source documents software"     "— Thanatos Intel";
        sub_filter "- software di documenti open source"  "— Thanatos Intel";
        sub_filter "open source documents software"       "Thanatos Intel";
        sub_filter "software di documenti open source"    "Thanatos Intel";
    }
}
