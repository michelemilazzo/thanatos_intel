server {
    listen 80;
    server_name docuseal.thanatos.agency;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name docuseal.thanatos.agency;

    ssl_certificate     /etc/letsencrypt/live/docuseal.thanatos.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docuseal.thanatos.agency/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Serve il favicon Thanatos
    location = /favicon.ico {
        proxy_pass https://www.thanatos.agency/assets/thanatos_intel/images/thanatos-icon-32.png;
        proxy_ssl_server_name on;
    }
    # Logo Thanatos al posto del DocuSeal
    location = /thanatos-logo.png {
        proxy_pass https://www.thanatos.agency/assets/thanatos_intel/images/thanatos-logo-mark.png;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;

        # Disable gzip from upstream for sub_filter to work
        proxy_set_header Accept-Encoding "";

        # Inject Thanatos CSS + logo override into every HTML page
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>'
            '<link rel="icon" href="/favicon.ico">
             <style id="thanatos-brand">
               :root { --thanatos-navy:#0A0E1A; --thanatos-gold:#c8a96e; }
               body, .navbar, header, .bg-base-100, .bg-base-200 { background:#0A0E1A !important; color:#eee !important; }
               .navbar a, .navbar span, .navbar button, header * { color:#c8a96e !important; }
               a.btn-warning, .btn-warning { display:none !important; }
               a[href*="docuseal.com"], a[href*="github.com/docusealco"], a[href*="docuseal.co"] { display:none !important; }
               img[src*="logo.svg"], img[alt*="DocuSeal"], svg.logo, [class*="docuseal"][class*="logo"] {
                 content: url("/thanatos-logo.png") !important;
                 max-height:38px !important; width:auto !important;
               }
               .footer { background:#0A0E1A !important; color:#c8a96e !important; }
               .footer * { color:#c8a96e !important; }
               .btn-primary { background:#c8a96e !important; border-color:#c8a96e !important; color:#0A0E1A !important; }
               .badge-primary { background:#c8a96e !important; color:#0A0E1A !important; }
               .input-bordered:focus, .select-bordered:focus, .textarea-bordered:focus {
                 outline-color:#c8a96e !important; border-color:#c8a96e !important;
               }
               #thanatos-brand-footer {
                 position:fixed; bottom:6px; right:10px; font-size:10px;
                 color:#c8a96e; opacity:0.7; pointer-events:none; z-index:9999;
                 font-family:Georgia,serif;
               }
             </style></head>';
        sub_filter '| DocuSeal</title>' '| Thanatos Sign</title>';
        sub_filter '<title>DocuSeal'  '<title>Thanatos Sign';
        sub_filter 'DocuSeal | Open Source Document Signing' 'Thanatos Intel — Firma elettronica';
        sub_filter '>DocuSeal<' '>Thanatos Sign<';
        sub_filter '<a href="https://www.docuseal.com/start" class="underline">Thanatos Sign</a> - open source documents software' '<span class="font-semibold" style="color:#c8a96e">Thanatos Intel by MMOS</span>';
        sub_filter '<a href="https://www.docuseal.com/start" class="underline">DocuSeal</a> - open source documents software' '<span class="font-semibold" style="color:#c8a96e">Thanatos Intel by MMOS</span>';
        sub_filter '- open source documents software' '<span class="font-semibold" style="color:#c8a96e">Thanatos Intel by MMOS</span>';
        sub_filter '- software di documenti open source' '<span class="font-semibold" style="color:#c8a96e">Thanatos Intel by MMOS</span>';
        sub_filter 'open source documents software' 'Thanatos Intel by MMOS';
        sub_filter 'software di documenti open source' 'Thanatos Intel by MMOS';
        sub_filter '</body>'
            '<div id="thanatos-brand-footer">THANATOS INTEL · Powered by OneKey Co.</div>
             <script>
               (function(){
                 function rw(){
                   var t=document.title;
                   if(t.endsWith("| DocuSeal")) document.title=t.slice(0,-10)+"| Thanatos Sign";
                   else if(t==="DocuSeal") document.title="Thanatos Sign";
                   else if(t.startsWith("DocuSeal | ")) document.title="Thanatos Sign | "+t.slice(11);
                 }
                 function replaceLogo(){
                   document.querySelectorAll("svg[viewBox=\"0 0 180 180\"]:not([data-thanatos])").forEach(function(s){
                     var img = document.createElement("img");
                     img.src = "/thanatos-logo.png";
                     img.alt = "Thanatos Intel";
                     img.setAttribute("data-thanatos","1");
                     img.style.cssText = "height:" + (s.getAttribute("height") || "44") + "px;width:auto;display:inline-block;vertical-align:middle";
                     s.parentNode.replaceChild(img, s);
                   });
                 }
                 rw(); replaceLogo();
                 setInterval(function(){ rw(); replaceLogo(); }, 400);
                 new MutationObserver(function(){ rw(); replaceLogo(); }).observe(document.documentElement,{childList:true,subtree:true});
               })();
             </script></body>';
    }
}
