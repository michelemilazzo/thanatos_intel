name: Thanatos CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Python compile check
        run: python -m compileall thanatos_intel
      - name: Run pytest suite
        run: pytest -v tests

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside Python Docker container
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            python:3.11-bookworm \
            bash -lc "pip install pytest && python -m compileall thanatos_intel && pytest -v tests"
